<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — SpaceLoading (Blazor)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #ECEFF3; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
.frame { width: min(640px, 100%); box-shadow: 0 8px 40px rgba(0,0,0,.07); border-radius: 12px; }
/* SpaceLoading.razor.css — CSS Isolation (Blazor)
   Paleta extraída da referência: traço #23CCE6 · fundo #FDFDFD · texto #3A3F47 */

.space-loading {
    --accent: #23CCE6;
    --bg: #FDFDFD;
    --ink: #3A3F47;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    min-height: 380px;
    width: 100%;
    background: var(--bg);
    border-radius: 12px;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
}

/* ---------- Palco dos ícones ---------- */
.icon-stage {
    position: relative;
    width: 110px;
    height: 110px;
}

.icon {
    position: absolute;
    inset: 0;
    stroke: var(--accent);
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    pointer-events: none;
}

/* Estado desenhável: cada path tem pathLength="100" */
.icon :is(path, circle, rect) {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
}

/* Ícone ativo: flutua suavemente e os traços se desenham */
.icon.active {
    opacity: 1;
    animation: float-in 2.2s ease-in-out forwards;
}

.icon.active :is(path, circle, rect) {
    animation: draw 1.1s cubic-bezier(.5, 0, .3, 1) forwards;
}

/* Traços secundários (detalhes) desenham depois */
.icon.active .dash  { animation-delay: .35s; }
.icon.active .spark { animation-delay: .55s; }

@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes float-in {
    0%   { transform: translateY(8px) scale(.92); opacity: 0; }
    18%  { transform: translateY(0)   scale(1);   opacity: 1; }
    82%  { transform: translateY(-3px) scale(1);  opacity: 1; }
    100% { transform: translateY(-10px) scale(.95); opacity: 0; }
}

/* ---------- Texto ---------- */
.label {
    margin: 0;
    color: var(--ink);
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: .01em;
    user-select: none;
}

.dot {
    display: inline-block;
    animation: dot-blink 1.4s ease-in-out infinite;
}

.dot:nth-child(2) { animation-delay: .25s; }
.dot:nth-child(3) { animation-delay: .5s; }

@keyframes dot-blink {
    0%, 100% { opacity: .15; }
    40%      { opacity: 1; }
}

/* ---------- Acessibilidade ---------- */
@media (prefers-reduced-motion: reduce) {
    .icon.active { animation: none; opacity: 1; transform: none; }
    .icon.active :is(path, circle, rect) { animation: none; stroke-dashoffset: 0; }
    .dot { animation: none; opacity: 1; }
}

</style>
</head>
<body>
<div class="frame">
  <div class="space-loading" role="status" aria-label="Space Loading">
    <div class="icon-stage">
<svg class="icon " viewBox="0 0 100 100" fill="none">
            <g transform="rotate(40 50 50)">
                <path pathLength="100" d="M50 12c9 9 13 21 13 34 0 8-2 15-4 20H41c-2-5-4-12-4-20 0-13 4-25 13-34Z"/>
                <circle pathLength="100" cx="50" cy="40" r="6"/>
                <path pathLength="100" d="M38 52l-8 13c5 1 9 0 12-2"/>
                <path pathLength="100" d="M62 52l8 13c-5 1-9 0-12-2"/>
                <path pathLength="100" class="dash" d="M50 72v8M50 86v5"/>
            </g>
            <path pathLength="100" class="spark" d="M22 24v8M18 28h8"/>
            <path pathLength="100" class="spark" d="M80 70v6M77 73h6"/>
        </svg>
<svg class="icon " viewBox="0 0 100 100" fill="none">
            <circle pathLength="100" cx="50" cy="50" r="22"/>
            <path pathLength="100" d="M25 62C12 58 8 50 14 44c4-4 12-6 22-6M64 38c14 2 22 8 17 15-3 5-12 8-23 9"/>
            <path pathLength="100" class="dash" d="M42 45h9M52 55h7M40 55h4"/>
            <path pathLength="100" d="M34 84h32"/>
        </svg>
<svg class="icon " viewBox="0 0 100 100" fill="none">
            <g transform="rotate(-18 50 50)">
                <circle pathLength="100" cx="50" cy="32" r="13"/>
                <path pathLength="100" d="M42 32c1-4 4-7 8-7"/>
                <rect pathLength="100" x="39" y="47" width="22" height="26" rx="7"/>
                <path pathLength="100" d="M39 54h-7v12h7M61 54h7v12h-7"/>
                <path pathLength="100" d="M44 73l-3 10M56 73l3 10"/>
            </g>
            <path pathLength="100" class="dash" d="M64 78c8 4 14 2 16-4"/>
        </svg>
<svg class="icon " viewBox="0 0 100 100" fill="none">
            <circle pathLength="100" cx="32" cy="30" r="12"/>
            <path pathLength="100" class="dash" d="M26 27h6M32 33h6"/>
            <path pathLength="100" d="M60 24v46"/>
            <path pathLength="100" d="M60 26h22v14H60"/>
            <path pathLength="100" class="dash" d="M66 33h10"/>
            <path pathLength="100" d="M40 74c8-5 24-5 34 0"/>
        </svg>
<svg class="icon " viewBox="0 0 100 100" fill="none">
            <circle pathLength="100" cx="36" cy="68" r="8"/>
            <circle pathLength="100" cx="66" cy="68" r="8"/>
            <path pathLength="100" d="M28 58h46l-6-14H40l-12 14Z"/>
            <path pathLength="100" d="M56 44V32"/>
            <path pathLength="100" d="M48 30c2-6 12-6 14 0"/>
            <path pathLength="100" class="dash" d="M22 80h58"/>
        </svg>
    </div>
    <p class="label">Space Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
  </div>
</div>

<script>
// Simula o PeriodicTimer do componente Blazor.
const icons = [...document.querySelectorAll('.icon')];
let current = 0;
icons[0].classList.add('active');

setInterval(() => {
  icons[current].classList.remove('active');
  current = (current + 1) % icons.length;
  // reflow para reiniciar as animações CSS do ícone reativado
  void icons[current].offsetWidth;
  icons[current].classList.add('active');
}, 2200);
</script>
</body>
</html>
